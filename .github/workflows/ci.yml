name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # 钉死镜像版本以求可复现构建：`-latest` 会在 GitHub 侧静默迁移 OS
        # （ubuntu-latest 现为 24.04，windows-latest 现为 Server 2025）。
        # 这两个标签即当前 latest 的实际指向，升级需显式改这里。
        os: [ubuntu-24.04, windows-2025]
        node: [22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --no-audit --no-fund
      - run: npm test
