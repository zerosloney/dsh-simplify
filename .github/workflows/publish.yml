name: publish

# 打 v* 标签时构建并发布到 npm。
# 前置：仓库需配置 NPM_TOKEN secret（发布账号的 access token，packages:write）。
on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    # 钉死镜像版本（ubuntu-latest 现为 24.04），避免发布环境随 GitHub 迁移而变。
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
